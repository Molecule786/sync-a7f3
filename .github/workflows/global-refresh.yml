name: ClassPass precise live refresh - top 40 GDP
on:
  workflow_run:
    workflows: ['Verified expired event retention']
    types: [completed]
  schedule:
    - cron: '13 10 * * *' # One bounded retry: 15:13 Pakistan time.
  workflow_dispatch:
    inputs:
      scope:
        description: Full existing-record verification and all discovered top-40 country routes
        type: choice
        options: [all, existing_only, markets_only]
        default: all
permissions:
  contents: read
concurrency:
  group: classpass-production-writer
  cancel-in-progress: false
jobs:
  plan:
    if: ${{ github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      shards: ${{ steps.existing.outputs.shards }}
      markets: ${{ steps.markets.outputs.markets }}
      has_markets: ${{ steps.markets.outputs.has_markets }}
      run_existing: ${{ steps.markets.outputs.run_existing }}
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: pip
      - run: pip install -r requirements.txt
      - run: python -m unittest test_precise_refresh test_global test_global_recovery
      - id: markets
        env:
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
          RETRY_ONLY: ${{ github.event_name == 'schedule' && github.event.schedule == '13 10 * * *' }}
          REQUEST_SCOPE: ${{ inputs.scope }}
        run: python plan_classpass.py
      - id: existing
        shell: python
        run: |
          import json,os
          n=len(json.load(open('output/recheck-manifest.json'))['event_ids'])
          with open(os.environ['GITHUB_OUTPUT'],'a') as f:f.write('shards='+json.dumps(list(range((n+99)//100)) or [0])+'\n')
      - uses: actions/upload-artifact@v6
        with:
          name: existing-record-manifest
          path: output/recheck-manifest.json
          overwrite: true
          retention-days: 7
  recheck:
    needs: plan
    if: needs.plan.outputs.run_existing == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 6
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        shard: ${{ fromJSON(needs.plan.outputs.shards) }}
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: pip
      - run: pip install -r requirements.txt
      - uses: actions/download-artifact@v6
        with:
          name: existing-record-manifest
          path: output
      - name: Verify original source sessions and preserve unchanged fields
        env:
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
          SHARD: ${{ matrix.shard }}
        run: python recheck_existing.py --shard "$SHARD"
      - if: always()
        uses: actions/upload-artifact@v6
        with:
          name: source-recheck-${{ matrix.shard }}
          path: |
            output/recheck-${{ matrix.shard }}/summary.json
            output/recheck-${{ matrix.shard }}/source-checks.json
          retention-days: 7
          overwrite: true
  markets:
    needs: [plan,recheck]
    if: ${{ !cancelled() && needs.plan.result == 'success' && needs.plan.outputs.has_markets == 'true' && inputs.scope != 'existing_only' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 16
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        market: ${{ fromJSON(needs.plan.outputs.markets) }}
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: pip
      - run: pip install -r requirements.txt
      - name: Search current seven-day schedules and merge verified source changes
        env:
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
          MARKET: ${{ matrix.market }}
        run: python refresh_market.py --market "$MARKET" --attempts 3
      - if: always()
        uses: actions/upload-artifact@v6
        with:
          name: market-${{ matrix.market }}
          path: |
            output/global/${{ matrix.market }}/summary.json
            output/global/${{ matrix.market }}/attempt-results.json
            output/global/${{ matrix.market }}/change-audit.json
          retention-days: 7
          overwrite: true
  report:
    needs: [plan,recheck,markets]
    if: always() && needs.plan.result == 'success'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: pip
      - run: pip install -r requirements.txt
      - uses: actions/download-artifact@v6
        with:
          name: existing-record-manifest
          path: output
      - uses: actions/download-artifact@v6
        with:
          pattern: source-recheck-*
          path: output/run-rechecks
      - uses: actions/download-artifact@v6
        with:
          pattern: market-*
          path: output/run-markets
      - name: Reconcile all forty countries without hiding unresolved gaps
        if: always()
        env:
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
        run: python report_refresh.py
      - uses: actions/upload-artifact@v6
        with:
          name: all-40-country-report
          path: output/country-refresh-report.*
          retention-days: 7
          overwrite: true
