name: One-off obsolete test data backup
on: workflow_dispatch
permissions:
  contents: read
concurrency:
  group: classpass-production-writer
  cancel-in-progress: false
jobs:
  backup:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - run: pip install -r requirements-event-refresh.txt
      - name: Back up isolated rows and caches without changing the database
        env:
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
        shell: python
        run: |
          import base64,gzip,hashlib,json,os,secrets
          from pathlib import Path
          from datetime import datetime,timezone
          from curl_cffi import requests
          from cryptography.hazmat.primitives import hashes,serialization
          from cryptography.hazmat.primitives.asymmetric import padding
          from cryptography.hazmat.primitives.ciphers.aead import AESGCM
          root=Path('output/test-data-backup');root.mkdir(parents=True)
          url=json.loads(Path('config.json').read_text())['supabase_url']
          secret=os.environ['SUPABASE_SECRET_KEY']
          headers={'apikey':secret}
          if secret.startswith('eyJ'):headers['Authorization']='Bearer '+secret
          key=secrets.token_bytes(32);aes=AESGCM(key)
          pub=serialization.load_pem_public_key(Path('cleanup_backup_public.pem').read_bytes())
          wrapped=pub.encrypt(key,padding.OAEP(mgf=padding.MGF1(hashes.SHA256()),algorithm=hashes.SHA256(),label=None))
          manifest={'cutoff':datetime.now(timezone.utc).isoformat(),'events':0,'counts':{},'chunks':[],
                    'wrapped_key':base64.b64encode(wrapped).decode(),'format':'gzip+AES256GCM+RSA-OAEP-SHA256-v1'}
          targets=[('events_global_test','id',None),('classpass_events_test','id',None),
                   ('venues_global_test','id',None),('directory_jobs_global_test','market_id','classpass')]
          for table,order,source in targets:
              offset=0;seen=set()
              while True:
                  params={'select':'*','order':order+'.asc','limit':50,'offset':offset}
                  if source:params['source']='eq.'+source
                  response=requests.get(url+'/rest/v1/'+table,headers=headers,params=params,timeout=60)
                  if response.status_code!=200:raise RuntimeError('Backup read failed for '+table+' HTTP '+str(response.status_code))
                  rows=response.json()
                  if not isinstance(rows,list):raise RuntimeError('Invalid backup response')
                  if not rows:break
                  for row in rows:
                      identity=str(row[order])
                      if identity in seen:raise RuntimeError('Repeated backup row')
                      seen.add(identity)
                  raw=json.dumps({table:rows},ensure_ascii=False,separators=(',',':')).encode()
                  index=len(manifest['chunks']);nonce=secrets.token_bytes(12)
                  sealed=nonce+aes.encrypt(nonce,gzip.compress(raw),str(index).encode())
                  assert gzip.decompress(aes.decrypt(nonce,sealed[12:],str(index).encode()))==raw
                  name=f'{index:04}.bin';(root/name).write_bytes(sealed)
                  manifest['chunks'].append({'file':name,'sha256':hashlib.sha256(sealed).hexdigest(),'raw_sha256':hashlib.sha256(raw).hexdigest()})
                  offset+=len(rows)
                  if len(rows)<50:break
              manifest['counts'][table]=len(seen)
              print(table,len(seen),flush=True)
          assert manifest['counts']['events_global_test']==1680
          assert manifest['counts']['classpass_events_test']==20
          assert manifest['counts']['directory_jobs_global_test']==7
          assert manifest['counts']['venues_global_test']==5038
          (root/'manifest.json').write_text(json.dumps(manifest,indent=2))
          with open(os.environ['GITHUB_STEP_SUMMARY'],'a') as f:
              f.write('Encrypted read-only backup complete. No database data changed.\n\n'+json.dumps(manifest['counts'],indent=2))
      - uses: actions/upload-artifact@v6
        with:
          name: obsolete-test-data-encrypted-backup
          path: output/test-data-backup/
          retention-days: 7
          if-no-files-found: error
