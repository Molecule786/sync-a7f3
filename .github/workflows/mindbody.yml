name: Mindbody studios and scheduled classes
on:
  schedule:
    - cron: '37 20 * * *'
  workflow_dispatch:
    inputs:
      country:
        description: 'Two-letter country code or all for top 40 GDP scope'
        default: US
        type: string
      mode:
        type: choice
        options: [preview, production]
        default: preview
      venues:
        description: 'Maximum rotating existing studios per country (1..200)'
        default: '3'
        type: string
      new_events:
        description: 'Maximum new classes per country (0..100)'
        default: '10'
        type: string
permissions:
  contents: read
concurrency:
  group: mindbody-production-writer
  cancel-in-progress: false
jobs:
  plan:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      countries: ${{ steps.scope.outputs.countries }}
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - id: scope
        env:
          COUNTRY: ${{ inputs.country || 'all' }}
        run: |
          python - <<'PY'
          import os,json
          countries='US CN DE JP GB IN FR RU IT BR CA KR MX AU ES TR ID NL SA CH PL TW BE AR IL SE IE SG AE NO AT TH CO MY VN BD PH DK ZA RO'.split()
          selected=os.environ['COUNTRY'].strip().upper()
          if selected!='ALL' and selected not in countries:raise ValueError('Country outside top-40 scope')
          with open(os.environ['GITHUB_OUTPUT'],'a') as f:f.write('countries='+json.dumps(countries if selected=='ALL' else [selected])+'\n')
          PY
  sync:
    needs: plan
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        country: ${{ fromJSON(needs.plan.outputs.countries) }}
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: pip
      - run: pip install -r requirements.txt
      - run: python -m unittest test_mindbody -v
      - name: Verify public studio profiles and next seven days of classes
        env:
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
          COUNTRY: ${{ matrix.country }}
          APPLY: ${{ github.event_name == 'schedule' || inputs.mode == 'production' }}
          VENUES: ${{ inputs.venues || '100' }}
          NEW_EVENTS: ${{ inputs.new_events || '50' }}
        run: |
          args=()
          if [ "$APPLY" = "true" ]; then args+=(--apply); fi
          python mindbody_sync.py --country "$COUNTRY" --venues "$VENUES" --new-events "$NEW_EVENTS" "${args[@]}"
      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: mindbody-${{ matrix.country }}-summary
          path: output/mindbody-*-summary.json
          retention-days: 7
          overwrite: true
          if-no-files-found: ignore
  report:
    needs: [plan, sync]
    if: always() && needs.plan.result == 'success'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/download-artifact@v6
        with:
          pattern: mindbody-*-summary
          path: output
          merge-multiple: true
      - env:
          COUNTRIES: ${{ needs.plan.outputs.countries }}
        run: |
          python - <<'PY'
          import os,json
          from pathlib import Path
          root=Path('output');root.mkdir(exist_ok=True)
          results={}
          for country in json.loads(os.environ['COUNTRIES']):
              p=root/('mindbody-'+country+'-summary.json')
              results[country]=json.loads(p.read_text()) if p.exists() else {'country':country,'status':'missing_job_result','gaps':['Job did not produce a summary; coverage unknown']}
          report={'coverage':'Staged rotation, not exhaustive national coverage','countries':results}
          (root/'mindbody-country-report.json').write_text(json.dumps(report,indent=2))
          with open(os.environ['GITHUB_STEP_SUMMARY'],'a') as f:
              f.write('## Mindbody staged country report\n\nCountry | Studios checked | Classes inserted | New studios | Status\n--- | ---: | ---: | ---: | ---\n')
              for c,r in results.items():f.write(f"{c} | {r.get('venues_checked','unknown')} | {r.get('events_inserted','unknown')} | {r.get('new_venues_discovered','unknown')} | {r['status']}\n")
              f.write('\nRead the report artifact for limits and unresolved gaps. Missing/unsearched results are never confirmed zero.\n')
          if any(r.get('blocked') or r['status']=='missing_job_result' for r in results.values()):raise SystemExit(2)
          PY
      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: mindbody-country-report
          path: output/mindbody-country-report.json
          retention-days: 7
          overwrite: true
