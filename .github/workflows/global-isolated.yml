name: ClassPass worldwide isolated collection
on:
  workflow_dispatch:
    inputs:
      market_ids:
        description: Top-40-GDP country market IDs separated by commas, or all (bounded attempts)
        required: true
        default: '84,69,80'
permissions:
  contents: read
concurrency:
  group: classpass-global-isolated
  cancel-in-progress: false
jobs:
  plan:
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    outputs:
      markets: ${{ steps.plan.outputs.markets }}
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - id: plan
        env:
          REQUESTED: ${{ inputs.market_ids }}
        shell: python
        run: |
          import json, os
          catalogue=json.load(open('global_markets.json',encoding='utf-8'))
          known={m['id'] for m in catalogue}
          requested=os.environ['REQUESTED'].strip()
          selected=([84,69,80]+[m['id'] for m in catalogue if m['id'] not in (84,69,80)]) if requested=='all' else [int(x.strip()) for x in requested.split(',')]
          assert selected and set(selected)<=known and len(set(selected))==len(selected)
          with open(os.environ['GITHUB_OUTPUT'],'a') as f:f.write('markets='+json.dumps(selected)+'\n')
  collect:
    needs: plan
    runs-on: ubuntu-24.04
    timeout-minutes: 6
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        market: ${{ fromJSON(needs.plan.outputs.markets) }}
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: pip
      - run: pip install -r requirements.txt
      - name: Collect and merge isolated worldwide records
        env:
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
          MARKET: ${{ matrix.market }}
        run: python run_global.py --market "$MARKET" --max-requests 150
      - name: Retain source evidence and partial coverage
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: global-${{ matrix.market }}-${{ github.run_id }}
          path: output/global/
          retention-days: 7
