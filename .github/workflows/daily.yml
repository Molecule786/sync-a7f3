name: ClassPass daily US staged sync

on:

  schedule:

    - cron: '17 10 * * *'

    - cron: '17 11 * * *' # Retry unfinished staged markets only

  workflow_dispatch:

    inputs:

      mode:

        description: Preview, isolated NYC test, production refresh, or retry unfinished US work

        type: choice

        options:

          - preview

          - test

          - production

          - retry

        default: preview

permissions:

  contents: read

concurrency:

  group: classpass-pilot

  cancel-in-progress: false

jobs:

  us_plan:

    if: ${{ github.event_name == 'schedule' || inputs.mode != 'test' }}

    runs-on: ubuntu-24.04

    timeout-minutes: 2

    outputs:

      markets: ${{ steps.plan.outputs.markets }}

    steps:

      - uses: actions/checkout@v6

        with:

          persist-credentials: false

      - id: plan

        shell: python

        run: |

          import json, os

          stage=json.load(open('us_stage.json'))

          markets=stage['active_market_ids']

          assert len(markets)<=3, 'Free-plan stage allows at most three markets'

          with open(os.environ['GITHUB_OUTPUT'],'a') as f:

              f.write('markets='+json.dumps(markets)+'\n')

  us_collect:

    needs: us_plan

    runs-on: ubuntu-24.04

    timeout-minutes: 6

    strategy:

      fail-fast: false

      max-parallel: 1

      matrix:

        market: ${{ fromJSON(needs.us_plan.outputs.markets) }}

    steps:

      - uses: actions/checkout@v6

        with:

          persist-credentials: false

      - uses: actions/setup-python@v6

        with:

          python-version: '3.12'

          cache: pip

      - run: pip install -r requirements.txt

      - run: python -m unittest -v

      - name: Collect seven-day US market preview

        if: ${{ github.event_name == 'workflow_dispatch' && inputs.mode == 'preview' }}

        env:

          MARKET: ${{ matrix.market }}

        run: python us_collector.py --market "$MARKET" --max-requests 150

      - name: Upsert or resume seven-day US market schedules

        if: ${{ github.event_name == 'schedule' || inputs.mode == 'production' || inputs.mode == 'retry' }}

        env:

          MARKET: ${{ matrix.market }}

          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}

          RETRY_ONLY: ${{ github.event.schedule == '17 11 * * *' || inputs.mode == 'retry' }}

        shell: bash

        run: |

          args=()

          if [[ "$RETRY_ONLY" == "true" ]]; then args+=(--retry-only); fi

          python us_collector.py --market "$MARKET" --max-requests 150 --write-production "${args[@]}"

      - name: Save market coverage and verified rows

        if: always()

        uses: actions/upload-artifact@v6

        with:

          name: classpass-us-${{ matrix.market }}-${{ github.run_id }}

          path: output/

          retention-days: 7

      - name: Publish market coverage summary

        if: always()

        shell: python

        env:

          MARKET: ${{ matrix.market }}

        run: |

          import json, os

          from pathlib import Path

          p=Path('output')/('market-'+os.environ['MARKET'])/'summary.json'

          data=json.loads(p.read_text()) if p.exists() else {'status':'failed before collection'}

          with open(os.environ['GITHUB_STEP_SUMMARY'],'a') as f:

              f.write('## US market '+os.environ['MARKET']+'\n\n```json\n'+json.dumps(data,indent=2)+'\n```\n')

              f.write('Staged US coverage; country incomplete. Partial coverage fails the job. Upcoming does not mean bookable. Missing records are never automatically cancelled.\n')

  collect:

    if: ${{ github.event.schedule != '17 11 * * *' && inputs.mode != 'retry' }}

    runs-on: ubuntu-24.04

    timeout-minutes: 10

    steps:

      - uses: actions/checkout@v6

        with:

          persist-credentials: false

      - uses: actions/setup-python@v6

        with:

          python-version: '3.12'

          cache: pip

      - run: pip install -r requirements.txt

      - run: python -m unittest -v

      - name: Collect public schedule preview

        if: ${{ github.event_name == 'workflow_dispatch' && inputs.mode == 'preview' }}

        run: python collector.py

      - name: Collect and merge into isolated test table

        if: ${{ github.event_name == 'workflow_dispatch' && inputs.mode == 'test' }}

        env:

          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}

        run: python collector.py --write-test

      - name: Collect and upsert production pilot

        if: ${{ github.event_name == 'schedule' || inputs.mode == 'production' }}

        env:

          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}

        run: python collector.py --write-production

      - name: Save run results

        if: always()

        uses: actions/upload-artifact@v6

        with:

          name: classpass-pilot-${{ github.run_id }}

          path: output/

          retention-days: 7

      - name: Publish readable run summary

        if: always()

        shell: python

        run: |

          import json, os

          from pathlib import Path

          path = Path('output/summary.json')

          result = json.loads(path.read_text()) if path.exists() else {'status': 'failed before collection'}

          with open(os.environ['GITHUB_STEP_SUMMARY'], 'a') as f:

              f.write('## ClassPass pilot\n\n```json\n' + json.dumps(result, indent=2) + '\n```\n')

              f.write('Scope: current public day of two NYC studios, maximum 10 classes. No cancellation inference.\n')

  country_report:

    if: always()

    needs: [us_plan, us_collect]

    runs-on: ubuntu-24.04

    timeout-minutes: 1

    steps:

      - name: Report country coverage honestly

        env:

          JOB_RESULT: ${{ needs.us_collect.result }}

        run: |

          echo '## ClassPass / United States' >> "$GITHUB_STEP_SUMMARY"

          echo "Enabled staged market jobs: $JOB_RESULT" >> "$GITHUB_STEP_SUMMARY"

          echo 'Country coverage: INCOMPLETE — only three staged markets plus a separate small NYC pilot are enabled.' >> "$GITHUB_STEP_SUMMARY"

          echo 'Retry check: daily 11:17 UTC. Only recent unfinished retryable US snapshots are resumed; complete, blocked, expired and cooldown snapshots are skipped.' >> "$GITHUB_STEP_SUMMARY"

