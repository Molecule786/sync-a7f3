name: ClassPass isolated pipeline proof
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: classpass-pilot
  cancel-in-progress: false
jobs:
  verify-test-pipeline:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: pip
      - run: pip install -r requirements.txt
      - run: python -m unittest -v
      - name: Fetch ten classes, merge test table, verify repeat and update, restore source values
        env:
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
        run: python pipeline_test.py
      - name: Save source snapshots and verification report
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: isolated-pipeline-proof-${{ github.run_id }}
          path: output/pipeline-test-*.json
          retention-days: 7

